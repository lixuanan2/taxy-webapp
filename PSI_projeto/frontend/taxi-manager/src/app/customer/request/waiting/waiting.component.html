<!-- 🌟 Customer 等待司机响应页面 (WaitingComponent) -->

<div class="page-wrapper page-wrapper--customer">
  <div class="dashboard-card dashboard-card--waiting text-center">

    <!-- 🧭 页面标题 -->
    <h2 class="section-title mb-3">🚕 Looking for a Driver...</h2>
    <p class="lead text-muted">
      Please wait while we find an available driver for you.
    </p>

    <!-- 🔄 加载动画 (Spinner) -->
    <div class="spinner-border text-success mt-4" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>

    <!-- ❌ 取消请求按钮 -->
    <div class="mt-4">
      <button class="btn btn-outline-danger" (click)="cancelRequest()">
        ❌ Cancel Request
      </button>
    </div>

    <!-- 🧑‍✈️ 司机确认弹窗 -->
    <app-driver-confirm-dialog
      *ngIf="showDriverDialog"
      [driverName]="driverName"
      [distanceToClient]="distanceToClient"
      [etaToClient]="etaToClient"
      [estimatedPrice]="driverPrice"
      [taxiComfort]="taxiComfort"
      (accept)="onDriverAccepted()"
      (reject)="onDriverRejected()">
    </app-driver-confirm-dialog>

  </div>
</div>

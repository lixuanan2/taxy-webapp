<div class="page-wrapper page-wrapper--customer">
    <div class="dashboard-card dashboard-card--table">
      <h2 class="section-title mb-3 text-center">📜 My Request History</h2>
  
      <div class="table-container">
        <table class="table table-striped table-hover table-bordered table-sm">
          <thead>
            <tr>
              <th>Origin</th>
              <th>Destination</th>
              <th>Status</th>
              <th>Date</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngIf="requests.length === 0">
              <td colspan="4" class="text-center text-muted py-4">
                ℹ️ No request records found.
              </td>
            </tr>
            <tr *ngFor="let req of requests">
              <td>{{ req.currentLocation }}</td>
              <td>{{ req.destination }}</td>
              <td>
                <span
                  class="badge"
                  [ngClass]="{
                    'bg-success': req.status === 'accepted',
                    'bg-danger': req.status === 'rejected',
                    'bg-secondary': req.status === 'pending'
                  }">
                  {{ req.status }}
                </span>
              </td>
              <td>{{ req.createdAt | date:'short' }}</td>
            </tr>
          </tbody>
        </table>
      </div>
  
      <div class="text-start mt-4">
        <a mat-stroked-button class="btn-muted" routerLink="/customer">
          ⬅️ Back
        </a>
      </div>
    </div>
  </div>

<div class="page-wrapper">
  <mat-card class="dashboard-card">
    <!-- 🔥 欢迎头部 -->
    <div class="text-center mb-4">
      <h1 class="section-title">🚖 Welcome to <span class="app-name">Taxy WebApp</span></h1>
      <p class="muted">Your journey starts here – please choose your role</p>
    </div>

    <!-- 🎯 Material 表单区域 -->
    <form (ngSubmit)="goToDashboard()" #roleForm="ngForm" class="d-flex flex-column align-items-stretch gap-4">
      <mat-form-field appearance="outline" class="w-100">
        <mat-label>Who are you?</mat-label>
        <mat-select [(ngModel)]="selectedRole" name="role" required>
          <mat-option value="manager">👨‍💼 Manager</mat-option>
          <mat-option value="driver">🧑 Driver</mat-option>
          <mat-option value="customer">🧍 Customer</mat-option>
        </mat-select>
      </mat-form-field>

      <button mat-raised-button color="primary" type="submit" [disabled]="!selectedRole">
        Enter Dashboard
      </button>
    </form>
  </mat-card>
</div>

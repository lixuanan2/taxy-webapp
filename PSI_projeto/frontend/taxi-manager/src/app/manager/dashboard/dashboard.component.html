<!-- 🌟 Manager Dashboard 页面
     本页面为管理者入口，提供了出租车管理、司机管理、价格管理和报表查看的功能模块。
-->

<div class="page-wrapper">
  <div class="dashboard-card dashboard-card--manager">
    
    <!-- 🧭 标题区域 -->
    <h2 class="section-title text-center">🧭 Manager Dashboard</h2>

    <!-- 🚕 Taxi Management 模块 -->
    <div class="section-block">
      <h4>🚕 Taxi Management</h4>
      <div class="button-group-vertical">
        <a routerLink="/manager/taxi/taxi-form" class="btn btn-taxi w-100">Add New Taxi</a>
        <a routerLink="/manager/taxi/taxi-list" class="btn btn-taxi w-100">View Taxi List</a>
      </div>
    </div>

    <!-- 🧑 Driver Management 模块 -->
    <div class="section-block">
      <h4>🧑 Driver Management</h4>
      <div class="button-group-vertical">
        <a routerLink="/manager/driver/driver-form" class="btn btn-driver w-100">Register Driver</a>
        <a routerLink="/manager/driver/driver-list" class="btn btn-driver w-100">View Driver List</a>
      </div>
    </div>

    <!-- 📈 Price Management 模块 -->
    <div class="section-block">
      <h4>📈 Price Management</h4>
      <div class="button-group-vertical">
        <a routerLink="/manager/price/price-form" class="btn btn-price w-100">Set Price Per Minute</a>
        <a routerLink="/manager/price/price-list" class="btn btn-price w-100">View Price History</a>
      </div>
    </div>

    <!-- 📊 Reports 模块 -->
    <div class="section-block">
      <h4>📊 Reports</h4>
      <div class="button-group-vertical">
        <a routerLink="/manager/report" class="btn btn-report w-100">Driver Report</a>
        <a routerLink="/manager/customer-report" class="btn btn-report w-100">Customer Report</a>
      </div>
    </div>

  </div>
</div>

<!-- 🌟 Manager 查看价格历史记录页面 (PriceList)
     本页面展示保存过的 Basic / Luxury 价格及 Night Bonus 历史记录
-->

<div class="page-wrapper page-wrapper--manager">
  <div class="dashboard-card dashboard-card--table">

    <!-- 📜 页面标题 -->
    <h2 class="section-title mb-3">📜 Price History</h2>

    <!-- 📋 价格历史表格 -->
    <div class="table-container">
      <table class="table table-striped">
        <thead>
          <tr>
            <th>Basic (€)</th>
            <th>Luxury (€)</th>
            <th>Night Bonus (%)</th>
            <th>Created At</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let price of priceList">
            <td>{{ price.basic }}</td>
            <td>{{ price.luxury }}</td>
            <td>{{ price.nightBonus }}</td>
            <td>{{ price.createdAt | date: 'short' }}</td>
          </tr>
        </tbody>
      </table>

      <!-- ⬅️ 返回按钮 -->
      <div class="mt-4 text-start">
        <a mat-stroked-button class="btn-muted" routerLink="/manager">
          ⬅️ Back
        </a>
      </div>
    </div>

  </div>
</div>

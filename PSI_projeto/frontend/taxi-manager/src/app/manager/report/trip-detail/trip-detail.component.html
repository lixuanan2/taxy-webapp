<div class="container mt-4">
    <h2>🧾 Todas as Viagens</h2>
  
    <table class="table table-striped table-sm mt-3">
      <thead>
        <tr>
          <th>Motorista</th>
          <th>Táxi</th>
          <th>Início</th>
          <th>Fim</th>
          <th>Duração</th>
          <th>KM</th>
          <th>Origem</th>
          <th>Destino</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let trip of trips">
          <td>{{ trip.driverName }}</td>
          <td>{{ trip.vehiclePlate || 'N/A' }}</td>
          <td>{{ trip.startTime | date:'short' }}</td>
          <td>{{ trip.endTime | date:'short' }}</td>
          <td>{{ getDuration(trip) }} h</td>
          <td>{{ trip.kmTraveled?.toFixed(2) }}</td>
          <td>{{ trip.from }}</td>
          <td>{{ trip.to }}</td>
        </tr>
      </tbody>
    </table>
  
    <button class="btn btn-secondary" (click)="goBack()">⬅ Voltar</button>
  </div>

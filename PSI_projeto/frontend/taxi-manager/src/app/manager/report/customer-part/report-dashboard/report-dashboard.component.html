<!-- 📊 Customer Report 页面
     本页面用于展示客户旅程相关的汇总统计信息
-->

<div class="page-wrapper page-wrapper--manager page-wrapper--report-customer">
  <div class="dashboard-card dashboard-card--report">

    <!-- 🧑 页面标题 -->
    <h2 class="section-title text-center mb-4">📊 Customer Report</h2>

    <!-- 📅 日期筛选区域 -->
    <div class="row g-3 justify-content-center mb-4">
      <div class="col-md-4 col-sm-6">
        <label class="form-label">Start Date</label>
        <input type="date" [(ngModel)]="start" class="form-control" (change)="onDateChange()" />
      </div>
      <div class="col-md-4 col-sm-6">
        <label class="form-label">End Date</label>
        <input type="date" [(ngModel)]="end" class="form-control" (change)="onDateChange()" />
      </div>
    </div>

    <!-- 📦 统计卡片区域 -->
    <div class="grid-card-group mt-3">

      <!-- 🚕 总旅程数量 -->
      <div class="stat-card border-success" (click)="goToTrip()">
        <h5>Total Trips</h5>
        <div class="stat-value">{{ totalTrips || 0 }}</div>
      </div>

      <!-- 💰 总支付金额 -->
      <div class="stat-card border-primary" (click)="goToCustomerList()">
        <h5>Total Amount Charged</h5>
        <div class="stat-value">{{ totalAmount || 0 | currency:'EUR' }}</div>
      </div>

      <!-- 🧑 总客户数 -->
      <div class="stat-card border-warning" (click)="goToCustomerList()">
        <h5>Total Customers</h5>
        <div class="stat-value">{{ totalClients || 0 }}</div>
      </div>

    </div>

    <!-- ⬅️ 返回按钮 -->
    <div class="text-start mt-4">
      <a mat-stroked-button class="btn-muted" routerLink="/manager">⬅️ Back</a>
    </div>

  </div>
</div>

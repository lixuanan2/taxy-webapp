<div class="container mt-4">
    <h2>📊 Relatório de Clientes</h2>
  
    <div class="row mb-3">
      <div class="col-md-3">
        <label>Início:</label>
        <input type="date" [(ngModel)]="start" class="form-control" (change)="onDateChange()" />
      </div>
      <div class="col-md-3">
        <label>Fim:</label>
        <input type="date" [(ngModel)]="end" class="form-control" (change)="onDateChange()" />
      </div>
    </div>
  
    <div class="row text-center mb-4">
      <div class="col-md-4" (click)="goToCustomerList()">
        <div class="card bg-light border-primary">
          <div class="card-body">
            <h5>Total de Euros Cobrados</h5>
            <h2>{{ totalAmount || 0 | currency }}</h2>
          </div>
        </div>
      </div>
      <div class="col-md-4" (click)="goToTrip()">
        <div class="card bg-light border-success">
          <div class="card-body">
            <h5>Total de Viagens</h5>
            <h2>{{ totalTrips || 0 }}</h2>
          </div>
        </div>
      </div>
      <div class="col-md-4" (click)="goToCustomerList()">
        <div class="card bg-light border-warning">
          <div class="card-body">
            <h5>Total de Clientes</h5>
            <h2>{{ totalClients || 0 }}</h2>
          </div>
        </div>
      </div>
    </div>


</div>

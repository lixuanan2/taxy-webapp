<div class="container mt-4">
    <h2>📄 Detalhes da Fatura</h2>
    
    <div *ngIf="invoice">
      <ul class="list-group">
        <li class="list-group-item"><strong>ID da Fatura:</strong> {{ invoice.invoiceId }}</li>
        <li class="list-group-item"><strong>Cliente NIF:</strong> {{ invoice.clientNIF }}</li>
        <li class="list-group-item"><strong>Valor Total:</strong> {{ invoice.total | currency }}</li>
        <li class="list-group-item"><strong>Data:</strong> {{ invoice.date }}</li>
        <li class="list-group-item"><strong>Motorista:</strong> {{ invoice.driverName }}</li>
        <li class="list-group-item"><strong>ID da Viagem:</strong> {{ invoice.tripId }}</li>
      </ul>
      <button class="btn btn-secondary mt-3" (click)="goBack()">⬅ Voltar</button>
    </div>
  </div>

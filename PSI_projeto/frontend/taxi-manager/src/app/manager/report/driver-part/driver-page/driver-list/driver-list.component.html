<!-- 👤 Driver Summary 页面
     本页面用于展示每位司机的总小时数和总公里数，并支持跳转查看详细旅程
-->

<div class="page-wrapper page-wrapper--manager page-wrapper--manager-rp">
  <div class="dashboard-card dashboard-card--table-summary">

    <!-- 🧑 页面标题 -->
    <h2 class="section-title mb-3">👤 Driver Summary</h2>

    <!-- 📋 司机汇总表格 -->
    <div class="table-container">
      <table class="table table-striped table-bordered table-hover">
        <thead>
          <tr>
            <th>Name</th>
            <th>Total Hours</th>
            <th>Total KM</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let d of driverStats" (click)="goToDriverDetail(d.driverName)" style="cursor: pointer;">
            <td>{{ d.driverName }}</td>
            <td>{{ d.hours.toFixed(2) }}</td>
            <td>{{ d.km.toFixed(2) }}</td>
            <td>
              <button mat-stroked-button color="primary" class="btn-sm" (click)="goToDriverDetail(d.driverName); $event.stopPropagation()">
                📊 Detail
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- ⬅️ 返回按钮 -->
    <div class="text-start mt-4">
      <button mat-stroked-button class="btn-muted" (click)="goBack()">⬅️ Back</button>
    </div>

  </div>
</div>

<!-- 📌 Driver Trip Details 页面
     本页面用于展示所有司机的旅程详细列表，包括起止时间、持续时长、公里数、起点终点信息
-->

<div class="page-wrapper page-wrapper--manager page-wrapper--report-detail">
  <div class="dashboard-card dashboard-card--wide">

    <!-- 🧭 页面标题 -->
    <h2 class="section-title mb-3">📌 Driver Trip Details</h2>

    <!-- 📋 司机旅程数据表格 -->
    <div class="table-container mt-3">
      <table class="table table-striped table-bordered table-hover">
        <thead class="table-light">
          <tr>
            <th>Driver</th>
            <th>Taxi Plate</th>
            <th>Start</th>
            <th>End</th>
            <th>Duration</th>
            <th>KM</th>
            <th>Origin</th>
            <th>Destination</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let trip of trips">
            <td>{{ trip.driverName }}</td>
            <td>{{ trip.vehiclePlate || 'N/A' }}</td>
            <td>{{ trip.startTime | date:'short' }}</td>
            <td>{{ trip.endTime | date:'short' }}</td>
            <td>{{ getDuration(trip) }} h</td>
            <td>{{ trip.kmTraveled?.toFixed(2) }}</td>
            <td>{{ trip.from }}</td>
            <td>{{ trip.to }}</td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- ⬅️ 返回按钮 -->
    <div class="text-start mt-4">
      <button mat-stroked-button class="btn-muted" (click)="goBack()">⬅️ Back</button>
    </div>

  </div>
</div>

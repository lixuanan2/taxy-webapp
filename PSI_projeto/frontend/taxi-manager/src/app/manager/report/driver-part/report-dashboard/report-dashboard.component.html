<!-- 📊 Driver Report 页面
     本页面用于展示司机整体统计，包括司机总数、总小时数、总公里数，并提供快捷跳转
-->

<div class="page-wrapper page-wrapper--manager page-wrapper--report-trip">
  <div class="dashboard-card dashboard-card--report">

    <!-- 🧭 页面标题 -->
    <h2 class="section-title text-center mb-4">📊 Driver Report</h2>

    <!-- 📅 日期选择区域 -->
    <div class="row g-3 justify-content-center mb-4">
      <div class="col-md-4 col-sm-6">
        <label class="form-label">Start Date</label>
        <input type="date" [(ngModel)]="start" class="form-control" (change)="onDateChange()" />
      </div>
      <div class="col-md-4 col-sm-6">
        <label class="form-label">End Date</label>
        <input type="date" [(ngModel)]="end" class="form-control" (change)="onDateChange()" />
      </div>
    </div>

    <!-- 📦 统计卡片区域 -->
    <div class="grid-card-group mt-3">
      <div class="stat-card border-primary" (click)="goToTrip()">
        <h5>Total Trips</h5>
        <div class="stat-value">{{ totalTrips || 0 }}</div>
      </div>
      <div class="stat-card border-success" (click)="goToDriverList()">
        <h5>Total Hours</h5>
        <div class="stat-value">{{ totalHours || 0 }} h</div>
      </div>
      <div class="stat-card border-warning" (click)="goToTaxiList()">
        <h5>Total Distance</h5>
        <div class="stat-value">{{ totalKm || 0 }} km</div>
      </div>
    </div>

    <!-- ⬅️ 返回按钮 -->
    <div class="text-start mt-4">
      <a mat-stroked-button class="btn-muted" routerLink="/manager">⬅️ Back</a>
    </div>

  </div>
</div>

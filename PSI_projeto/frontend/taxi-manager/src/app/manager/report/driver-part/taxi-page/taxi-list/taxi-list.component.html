<!-- 🚕 Taxi Summary 页面
     本页面用于展示所有出租车的行驶总小时数和公里数统计，并支持跳转查看单辆出租车的详细旅程
-->

<div class="page-wrapper page-wrapper--manager page-wrapper--manager-rp">
  <div class="dashboard-card dashboard-card--table-summary">

    <!-- 🧭 页面标题 -->
    <h2 class="section-title mb-3">🚕 Taxi Summary</h2>

    <!-- 📋 出租车数据表格 -->
    <div class="table-container">
      <table class="table table-striped table-bordered table-hover">
        <thead>
          <tr>
            <th>Plate</th>
            <th>Total Hours</th>
            <th>Total KM</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let t of taxiStats" (click)="goToTaxiDetail(t.vehiclePlate)" style="cursor: pointer;">
            <td>{{ t.vehiclePlate }}</td>
            <td>{{ t.hours.toFixed(2) }}</td>
            <td>{{ t.km.toFixed(2) }}</td>
            <td>
              <button mat-stroked-button color="primary" class="btn-sm" (click)="goToTaxiDetail(t.vehiclePlate); $event.stopPropagation()">
                📊 Detail
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- ⬅️ 返回按钮 -->
    <div class="text-start mt-4">
      <button mat-stroked-button class="btn-muted" (click)="goBack()">⬅️ Back</button>
    </div>

  </div>
</div>

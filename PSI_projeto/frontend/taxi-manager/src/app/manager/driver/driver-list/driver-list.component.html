<!-- 🌟 Manager 查看司机列表页面 (DriverList)
     本页面展示所有注册的司机信息，支持编辑与删除操作
-->

<div class="page-wrapper page-wrapper--manager">
  <div class="dashboard-card dashboard-card--table">

    <!-- 🚗 页面标题 -->
    <h2 class="section-title mb-3">🚗 Driver List</h2>

    <!-- 📋 司机列表表格 -->
    <div class="table-container">
      <table class="table table-striped">
        <thead>
          <tr>
            <th>Name</th>
            <th>Gender</th>
            <th>Birth Year</th>
            <th>NIF</th>
            <th>License No.</th>
            <th>Address</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let driver of drivers">
            <td>{{ driver.name }}</td>
            <td>{{ driver.gender }}</td>
            <td>{{ driver.birthYear }}</td>
            <td>{{ driver.nif }}</td>
            <td>{{ driver.licenseNumber }}</td>
            <td>
              {{ driver.address.street }}, {{ driver.address.number }},
              {{ driver.address.postalCode }} {{ driver.address.city }}
            </td>
            <td>
              <!-- ✏️ 编辑按钮 -->
              <button mat-stroked-button color="primary" class="btn-sm me-2"
                      [routerLink]="['/manager/driver/edit', driver.nif]">
                ✏️ Edit
              </button>

              <!-- 🗑️ 删除按钮 -->
              <button mat-stroked-button color="warn" class="btn-sm me-2" (click)="onDelete(driver)">
                🗑️ Delete
              </button>
            </td>
          </tr>
        </tbody>
      </table>

      <!-- ⬅️ 返回按钮 -->
      <div class="mt-4 text-start">
        <a mat-stroked-button class="btn-muted" routerLink="/manager">
          ⬅️ Back
        </a>
      </div>
    </div>

  </div>
</div>

<div class="page-wrapper page-wrapper--manager">
  <div class="dashboard-card dashboard-card--table">
    <h2 class="section-title mb-3">🚗 Driver List</h2>

    <div class="table-container">
      <table class="table table-striped">
        <thead>
          <tr>
            <th>Name</th>
            <th>Gender</th>
            <th>Birth Year</th>
            <th>NIF</th>
            <th>License No.</th>
            <th>Address</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let driver of drivers">
            <td>{{ driver.name }}</td>
            <td>{{ driver.gender }}</td>
            <td>{{ driver.birthYear }}</td>
            <td>{{ driver.nif }}</td>
            <td>{{ driver.licenseNumber }}</td>
            <td>
              {{ driver.address.street }}, {{ driver.address.number }},
              {{ driver.address.postalCode }} {{ driver.address.city }}
            </td>
            <td>
              <button button mat-stroked-button color="primary" class="btn-sm me-2"
                      [routerLink]="['/manager/driver/edit', driver.nif]">
                ✏️ Edit
              </button>
              <button button mat-stroked-button color="warn" class="btn-sm me-2" (click)="onDelete(driver)">
                🗑️ Delete
              </button>
            </td>
          </tr>        
        </tbody>
      </table>
      <div class="mt-4 text-start">
        <a mat-stroked-button class="btn-muted" routerLink="/manager">
          ⬅️ Back
        </a>
      </div>
    </div>
  </div>
</div>

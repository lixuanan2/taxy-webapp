<div class="page-wrapper page-wrapper--manager">
  <div class="dashboard-card dashboard-card--table">
    <h2 class="section-title mb-3">🚗 Driver List</h2>

    <div class="table-container">
      <table class="table table-striped">
        <thead>
          <tr>
            <th>Name</th>
            <th>Gender</th>
            <th>Birth Year</th>
            <th>NIF</th>
            <th>License No.</th>
            <th>Address</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let driver of drivers">
            <td>{{ driver.name }}</td>
            <td>{{ driver.gender }}</td>
            <td>{{ driver.birthYear }}</td>
            <td>{{ driver.nif }}</td>
            <td>{{ driver.licenseNumber }}</td>
            <td>
              {{ driver.address.street }}, {{ driver.address.number }},
              {{ driver.address.postalCode }} {{ driver.address.city }}
            </td>
            <td>
              <button class="btn btn-sm btn-outline-primary me-2"
                      [routerLink]="['/manager/driver/edit', driver.nif]">
                ✏️ Edit
              </button>
              <button class="btn btn-sm btn-outline-danger" (click)="onDelete(driver)">
                🗑️ Remove
              </button>
            </td>
          </tr>        
        </tbody>
      </table>
    </div>
  </div>
</div>

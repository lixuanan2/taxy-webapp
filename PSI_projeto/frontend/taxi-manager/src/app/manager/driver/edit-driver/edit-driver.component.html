<div class="container mt-4">
    <h2>✏️ Editar Motorista</h2>
  
    <form (ngSubmit)="onSubmit()">
      <div class="mb-3">
        <label>Name</label>
        <input type="text" class="form-control" [(ngModel)]="driver.name" name="name" required>
      </div>
  
      <div class="mb-3">
        <label>Gender</label>
        <select class="form-select" [(ngModel)]="driver.gender" name="gender" required>
          <option value="male">Male</option>
          <option value="female">Female</option>
        </select>
      </div>
  
      <div class="mb-3">
        <label>Birth Year</label>
        <input type="number" class="form-control" [(ngModel)]="driver.birthYear" name="birthYear" required>
      </div>
  
      <div class="mb-3">
        <label>License Number</label>
        <input type="text" class="form-control" [(ngModel)]="driver.licenseNumber" name="licenseNumber" required>
      </div>
  
      <h5>📍 Endereço</h5>
  
      <div class="mb-2">
        <input placeholder="Street" class="form-control" [(ngModel)]="driver.address.street" name="street" required>
      </div>
      <div class="mb-2">
        <input placeholder="Number" class="form-control" [(ngModel)]="driver.address.number" name="number" required>
      </div>
      <div class="mb-2">
        <input placeholder="Postal Code" class="form-control" [(ngModel)]="driver.address.postalCode" name="postalCode" required>
      </div>
      <div class="mb-2">
        <input placeholder="City" class="form-control" [(ngModel)]="driver.address.city" name="city" required>
      </div>
  
      <button class="btn btn-primary mt-3" type="submit">Salvar</button>
      <a class="btn btn-secondary mt-3 ms-2" routerLink="/manager/driver/driver-list">Cancelar</a>
    </form>
  </div>

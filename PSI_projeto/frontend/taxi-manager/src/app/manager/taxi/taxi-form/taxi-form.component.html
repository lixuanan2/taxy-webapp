<!-- 🌟 Manager 添加出租车页面 (TaxiForm)
     本页面用于注册新的出租车，填写车牌、品牌、型号、年份和舒适等级
-->

<div class="page-wrapper page-wrapper--manager page-wrapper--manager--taxi-form">
  <div class="dashboard-card dashboard-card--form">
    <!-- 🚕 页面标题 -->
    <h2 class="section-title text-center mb-4">🚕 Add New Taxi</h2>

    <!-- 🎯 出租车注册表单 -->
    <form (ngSubmit)="onSubmit()" #taxiForm="ngForm" class="row g-3">

      <!-- 📋 Plate 输入 -->
      <div class="col-md-6">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Plate</mat-label>
          <input matInput name="plate"
                 [(ngModel)]="taxi.plate"
                 (input)="onPlateInput($event)"
                 #plateRef="ngModel"
                 required
                 [pattern]="getPlatePattern(taxi.year).pattern"
                 maxlength="8" />
          <mat-error *ngIf="plateRef.invalid && plateRef.touched">
            {{ getPlatePattern(taxi.year).formatTip }}
          </mat-error>
        </mat-form-field>
      </div>

      <!-- 📋 Brand 选择 -->
      <div class="col-md-6">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Brand</mat-label>
          <mat-select name="brand" [(ngModel)]="taxi.brand" required #brandRef="ngModel">
            <mat-option value="" disabled>-- Select brand --</mat-option>
            <mat-option *ngFor="let brand of brands" [value]="brand">{{ brand }}</mat-option>
          </mat-select>
          <mat-error *ngIf="brandRef.invalid && brandRef.touched">
            Please select a brand.
          </mat-error>
        </mat-form-field>
      </div>

      <!-- 📋 Model 选择 -->
      <div class="col-md-6">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Model</mat-label>
          <mat-select name="model" [(ngModel)]="taxi.model" required [disabled]="models.length === 0">
            <mat-option value="" disabled>-- Select model --</mat-option>
            <mat-option *ngFor="let model of models" [value]="model">{{ model }}</mat-option>
          </mat-select>
        </mat-form-field>
      </div>

      <!-- 📋 Year 输入 -->
      <div class="col-md-6">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Year</mat-label>
          <input matInput type="number" name="year" [(ngModel)]="taxi.year"
                 [max]="currentYear" required #yearRef="ngModel" />
          <mat-error *ngIf="yearRef.errors?.['required'] && yearRef.touched">
            Year is required.
          </mat-error>
          <mat-error *ngIf="yearRef.errors?.['max'] && yearRef.touched">
            Year cannot be in the future.
          </mat-error>
        </mat-form-field>
      </div>

      <!-- 📋 Comfort Level 选择 -->
      <div class="col-md-6">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Comfort Level</mat-label>
          <mat-select name="comfortLevel" [(ngModel)]="taxi.comfortLevel" required>
            <mat-option value="basic">Basic</mat-option>
            <mat-option value="luxury">Luxury</mat-option>
          </mat-select>
        </mat-form-field>
      </div>

      <!-- 🔘 底部按钮区域 -->
      <div class="col-12 d-flex justify-content-between align-items-center mt-3">
        <!-- ⬅️ 返回按钮 -->
        <a mat-stroked-button class="btn-muted" routerLink="/manager">
          ⬅️ Back
        </a>

        <!-- ➕ 创建和清空按钮 -->
        <div class="d-flex gap-2">
          <button mat-raised-button color="primary" type="submit" [disabled]="!taxiForm.form.valid">
            ➕ Create Taxi
          </button>
          <button mat-raised-button class="btn-clear" type="button" (click)="onClearForm()">
            🧹 Clear Form
          </button>
        </div>
      </div>

    </form>
  </div>
</div>

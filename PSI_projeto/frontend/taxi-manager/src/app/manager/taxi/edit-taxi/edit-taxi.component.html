<div class="page-wrapper page-wrapper--manager page-wrapper--edit-taxi">
  <div class="dashboard-card dashboard-card--form">
    <h2 class="section-title text-center mb-4">✏️ Edit Taxi: {{ taxi.plate }}</h2>

    <form (ngSubmit)="onSubmit()" #editForm="ngForm" class="row g-3">

      <div class="col-md-6">
        <label class="form-label">Brand</label>
        <input [(ngModel)]="taxi.brand" name="brand" required class="form-control" />
      </div>

      <div class="col-md-6">
        <label class="form-label">Model</label>
        <input [(ngModel)]="taxi.model" name="model" required class="form-control" />
      </div>

      <div class="col-md-6">
        <label class="form-label">Year</label>
        <input [(ngModel)]="taxi.year" name="year" required type="number" class="form-control" />
      </div>

      <div class="col-md-6">
        <label class="form-label">Comfort Level</label>
        <select [(ngModel)]="taxi.comfortLevel" name="comfortLevel" class="form-select">
          <option value="basic">Basic</option>
          <option value="luxury">Luxury</option>
        </select>
      </div>

      <div class="col-12 text-end">
        <button type="submit" class="btn btn-success mt-3">💾 Save</button>
        <a class="btn btn-secondary mt-3 ms-2" routerLink="/manager/taxi/taxi-list">Cancel</a>
      </div>

    </form>
  </div>
</div>

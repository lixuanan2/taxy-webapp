<div class="page-wrapper page-wrapper--manager">
  <div class="dashboard-card dashboard-card--table">
    <h2 class="section-title mb-3">🚕 Taxi List</h2>

    <div class="table-container">
      <table class="table table-striped">
        <thead>
          <tr>
            <th>Plate</th>
            <th>Brand</th>
            <th>Model</th>
            <th>Year</th>
            <th>Comfort</th>
            <th>Created</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let taxi of taxis">
            <td>{{ taxi.plate }}</td>
            <td>{{ taxi.brand }}</td>
            <td>{{ taxi.model }}</td>
            <td>{{ taxi.year }}</td>
            <td>{{ taxi.comfortLevel }}</td>
            <td>{{ taxi.createdAt | date:'short' }}</td>
            <td>
              <button mat-stroked-button color="primary" class="btn-sm me-2" (click)="editTaxi(taxi.plate)">
                ✏️ Edit
              </button>
              <button mat-stroked-button color="warn" class="btn-sm" (click)="deleteTaxi(taxi.plate)">
                🗑️ Delete
              </button>
            </td>
          </tr>
        </tbody>
      </table>
      <div class="mt-4 text-start">
        <a mat-stroked-button class="btn-muted" routerLink="/manager">
          ⬅️ Back
        </a>
      </div>
    </div>
  </div>
</div>

<h2>🚕 Taxi List</h2>

<table class="table table-striped table-bordered table-hover mt-3">
  <thead>
    <tr>
      <th>Plate</th>
      <th>Brand</th>
      <th>Model</th>
      <th>Year</th>
      <th>Comfort</th>
      <th>Created</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let taxi of taxis">
      <td>{{ taxi.plate }}</td>
      <td>{{ taxi.brand }}</td>
      <td>{{ taxi.model }}</td>
      <td>{{ taxi.year }}</td>
      <td>{{ taxi.comfortLevel }}</td>
      <td>{{ taxi.createdAt | date:'short' }}</td>
      <td>
        <button class="btn btn-sm btn-primary" (click)="editTaxi(taxi.plate)">Editar</button>
        <button class="btn btn-sm btn-outline-danger" (click)="deleteTaxi(taxi.plate)">🗑️ Delete</button>
      </td>
    </tr>
  </tbody>
</table>

<div class="page-wrapper page-wrapper--driver">
  <div class="dashboard-card dashboard-card--form">
    <h2 class="section-title text-center mb-4">📋 Pending Requests</h2>

    <div *ngIf="loading" class="text-center text-muted my-3">
      ⏳ Loading requests...
    </div>

    <div *ngIf="!loading && requests.length === 0" class="alert alert-info text-center empty-hint">
      No pending requests at the moment.
    </div>

    <div class="request-card card p-3 mb-4" *ngFor="let req of requests">
      <div class="d-flex flex-wrap justify-content-between align-items-start">
        <!-- 左侧信息 -->
        <div class="request-info">
          <p><strong>Client NIF:</strong> {{ req.nif }}</p>
          <p><strong>From:</strong> {{ req.currentLocation }}</p>
          <p><strong>To:</strong> {{ req.destination }}</p>
          <p><strong>People:</strong> {{ req.peopleCount }}</p>
        </div>

        <!-- 右侧按钮 -->
        <div class="d-flex right-actions flex-column align-items-end gap-2 ms-3" style="min-width: 150px;">
          <button class="btn btn-success btn-sm w-100" (click)="accept(req._id!)">✅ Accept</button>
          <button class="btn btn-outline-danger btn-sm w-100" (click)="reject(req._id!)">❌ Reject</button>
          <div class="text-muted mt-1 small fw-semibold">
            ETA: {{ getEstimatedTime(req) }}
          </div>
        </div>

      </div>
      
    </div>
    <div class="text-start mt-3">
      <a mat-stroked-button class="btn-muted back-inside-left" routerLink="/driver/dashboard">⬅️ Back</a>
    </div>
  </div>
</div>

<div class="page-wrapper page-wrapper--driver">
  <div class="dashboard-card dashboard-card--table">
    <h2 class="section-title text-center mb-3">🧾 Issue Invoice</h2>

    <!-- 空状态提示 -->
    <div *ngIf="trips.length === 0" class="alert alert-info text-center mt-3 empty-hint">
      No trips available for invoicing.
    </div>

    <!-- 表格展示 -->
    <div class="table-container" *ngIf="trips.length > 0">
      <table class="table table-striped table-hover table-bordered table-sm">
        <thead class="table-light">
          <tr>
            <th>Client</th>
            <th>From</th>
            <th>To</th>
            <th>Price (€)</th>
            <th>Start</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let trip of trips">
            <td>{{ trip.clientNIF }}</td>
            <td>{{ trip.from }}</td>
            <td>{{ trip.to }}</td>
            <td>{{ trip.price | number:'1.2-2' }}</td>
            <td>{{ trip.startTime | date: 'short' }}</td>
            <td>
              <button class="btn btn-warning btn-sm" (click)="issue(trip)">
                🧾 Emitir
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- 🔙 返回按钮 -->
    <div class="text-start mt-4">
      <a mat-stroked-button class="btn-muted" routerLink="/driver/dashboard">
        ⬅️ Back
      </a>
    </div>
  </div>
</div>

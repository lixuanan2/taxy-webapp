<div class="page-wrapper page-wrapper--driver">
  <div class="dashboard-card dashboard-card--table">
    <h2 class="section-title text-center mb-3">📄 My Invoices</h2>

    <div *ngIf="trips.length === 0" class="alert alert-info text-center empty-hint">
      No invoices available.
    </div>

    <div class="table-container" *ngIf="trips.length > 0">
      <table class="table table-striped table-hover table-bordered table-sm">
        <thead class="table-light">
          <tr>
            <th># Client</th>
            <th>From</th>
            <th>To</th>
            <th>Total (€)</th>
            <th>Date</th>
            <th>Detail</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let trip of trips">
            <td>{{ trip.clientNIF }}</td>
            <td>{{ trip.from }}</td>
            <td>{{ trip.to }}</td>
            <td>{{ trip.price | currency:'EUR' }}</td>
            <td>{{ trip.startTime | date:'short' }}</td>
            <td>
              <a *ngIf="trip.invoiceId" [routerLink]="['/driver/invoice/detail', trip.invoiceId]">
                View
              </a>
            </td>
            <td>
              <button *ngIf="!trip.invoiceId" class="btn btn-warning btn-sm" (click)="issue(trip)">
                Emit
              </button>
              <span *ngIf="trip.invoiceId" class="text-success fw-semibold">
                Issued
              </span>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- 返回按钮 -->
    <div class="mt-4 text-start">
      <a mat-stroked-button class="btn-muted" routerLink="/driver/dashboard">
        ⬅️ Back
      </a>
    </div>
  </div>
</div>
